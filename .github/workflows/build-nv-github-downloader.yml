name: build-nv-github-downloader-oc

on:
  push:
    branches:
      - feature/nv-github-downloader-oc-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Objective-C source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p Sources
          printf '%s' '' | base64 --decode | gunzip > Sources/NVGitHubDownloader.m
          wc -l Sources/NVGitHubDownloader.m
          shasum -a 256 Sources/NVGitHubDownloader.m

      - name: Compile arm64 iOS dylib
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=14.0 \
            -dynamiclib \
            -O2 \
            -fno-objc-arc \
            Sources/NVGitHubDownloader.m \
            -framework Foundation \
            -Wl,-install_name,@rpath/NVGitHubDownloader.dylib \
            -o build/NVGitHubDownloader.dylib

      - name: Ad-hoc sign and verify
        shell: bash
        run: |
          set -euxo pipefail
          codesign --force --sign - build/NVGitHubDownloader.dylib
          file build/NVGitHubDownloader.dylib
          otool -hv build/NVGitHubDownloader.dylib
          otool -L build/NVGitHubDownloader.dylib
          codesign -dv --verbose=4 build/NVGitHubDownloader.dylib 2>&1 || true
          mkdir -p dist
          cp build/NVGitHubDownloader.dylib dist/NVGitHubDownloader.dylib
          shasum -a 256 dist/NVGitHubDownloader.dylib | tee dist/SHA256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NVGitHubDownloader-OC-arm64
          path: |
            dist/NVGitHubDownloader.dylib
            dist/SHA256.txt
          if-no-files-found: error
