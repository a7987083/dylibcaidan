name: build-neon-ios-modifier-v3.2

on:
  push:
    branches:
      - "feature/neon-ios-modifier-v1"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate 20-layout geometry
        run: |
          python3 Scripts/validate-layouts.py

      - name: Verify v0.3.2 source contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          compact = Path('Sources/ZNCompactLayoutFix.mm').read_text()
          ui = Path('Sources/ZNUIStabilityV032.mm').read_text()
          safety = Path('Sources/ZNRuntimeSafetyV032.mm').read_text()
          entry = Path('Sources/Entry.mm').read_text()
          makefile = Path('Makefile').read_text()
          build = Path('Scripts/build-ios.sh').read_text()
          assert 'ZN_COMPACT_LAYOUT_V4_20_DISTINCT_PORTRAIT' in compact
          assert 'ZN_UI_STABILITY_V032' in ui
          assert 'ZN_RUNTIME_SAFETY_V032' in safety
          assert 'ZNLayoutPickerScrollV032' in ui
          assert 'ZNPatchedOverlayHitTest' in ui
          assert 'ZNInstallUIStabilityV032();' in entry
          assert 'ZNInstallRuntimeSafetyV032();' in entry
          required = ['ZNSatellaBridge.mm','ZNMemoryEngine.mm','ZNCompactLayoutFix.mm','ZNUIStabilityV032.mm','ZNRuntimeSafetyV032.mm','ZNMenuViewController.mm']
          for name in required:
              assert name in makefile, f'Makefile missing {name}'
              assert name in build, f'build-ios.sh missing {name}'
          assert '@rpath/NeonModifier.dylib' in makefile
          assert '@rpath/NeonModifier.dylib' in build
          overlay = Path('Sources/ZNOverlay.mm').read_text()
          bridge = Path('Sources/ZNSatellaBridge.mm').read_text()
          assert 'ZNSatellaStart();' in overlay
          assert 'SATELLA_TEST_LAUNCHER_V2' in overlay
          assert 'kZNSatellaEntryRVA = 0x888C' in bridge
          assert 'dlopen(' in bridge
          assert 'ZNSatellaLastStatus' in bridge
          assert 'kZNSatellaEntryPrefix' in bridge
          assert 'CCE726AA' not in bridge  # UUID is stored as bytes, not a fragile string
          print('v0.3.2 + Satella launcher source contract: PASS')
          PY

      - name: Build arm64 iOS modifier dylib
        run: |
          chmod +x Scripts/build-ios.sh
          Scripts/build-ios.sh

      - name: Verify Mach-O and v0.3.2 runtime markers
        run: |
          file build/NeonModifier.dylib
          otool -hv build/NeonModifier.dylib
          otool -L build/NeonModifier.dylib
          strings build/NeonModifier.dylib | grep -q "ZN_COMPACT_LAYOUT_V4_20_DISTINCT_PORTRAIT"
          strings build/NeonModifier.dylib | grep -q "ZN_UI_STABILITY_V032"
          strings build/NeonModifier.dylib | grep -q "ZN_RUNTIME_SAFETY_V032"
          strings build/NeonModifier.dylib | grep -q "ZNLayoutPickerScrollV032"
          strings build/NeonModifier.dylib | grep -q "ZNNeonModifierLayoutIndex"
          strings build/NeonModifier.dylib | grep -q "SATELLA_TEST_LAUNCHER_V2"
          strings build/NeonModifier.dylib | grep -q "SatellaJailed-passive.dylib"
          cat build/SHA256.txt

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: NeonModifier-SatellaTestLauncher-v2-arm64
          path: |
            build/NeonModifier.dylib
            build/SHA256.txt
