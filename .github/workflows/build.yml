name: build-neon-ios-modifier-v3

on:
  push:
    branches:
      - "feature/neon-ios-modifier-v1"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 iOS modifier dylib
        run: |
          chmod +x Scripts/build-ios.sh
          Scripts/build-ios.sh
      - name: Verify Mach-O and Chinese 20-layout UI
        run: |
          file build/NeonModifier.dylib
          otool -hv build/NeonModifier.dylib
          otool -L build/NeonModifier.dylib
          strings build/NeonModifier.dylib | grep -q "UnityFramework+0x1A2B3C"
          strings build/NeonModifier.dylib | grep -q "ZNNeonModifierLayoutIndex"
          strings build/NeonModifier.dylib | grep -q "经典三栏"
          strings build/NeonModifier.dylib | grep -q "赛博仪表盘"
          strings build/NeonModifier.dylib | grep -q "选择布局风格"
          cat build/SHA256.txt
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: NeonModifier-v0.3.0-Chinese20Layouts-arm64
          path: |
            build/NeonModifier.dylib
            build/SHA256.txt
