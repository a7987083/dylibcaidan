name: build-ios-dylib

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 iOS dylib
        run: |
          chmod +x Scripts/build-ios.sh
          Scripts/build-ios.sh
      - name: Inspect Mach-O
        run: |
          file build/DylibCaidan.dylib
          otool -hv build/DylibCaidan.dylib
          otool -L build/DylibCaidan.dylib
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: DylibCaidan-arm64
          path: build/DylibCaidan.dylib
